<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todos</title>
    <script src="https://kit.fontawesome.com/9b4a696266.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="styles.css" rel="stylesheet">

</head>
<body>
    
    <div class="container">
        <header class="text-center text-warning my-4">
            <h1 class="mb-4">Josh Malaskys
            <br> Todo List
            </h1>
            <p> Search The list</p>
            <form class="search">
                <input type="text" class="form-control m-auto" name="search" placeholder="Search To Dos">
            </form>
        </header>

        <ul class="list-group todos mx-auto text-light">
            
        </ul>

        <form class="add text-center my-4">
            <label class="text-warning">Add a new To Do...</label>
            <input type="text" class="form-control m-auto" name="add" />
        </form>

    </div>


    
    <script src="app.js"> </script>
</body>
</html>
